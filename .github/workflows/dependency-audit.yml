name: Dependency audit

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

jobs:
  platform-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/platform
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Composer audit
        run: composer audit

  monitoring-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/monitoring-app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Dart dependency audit
        run: dart pub outdated --no-dev-dependencies
