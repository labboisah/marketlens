name: marketlens_monitoring_app
description: Android-first MarketLens Monitoring App for Platform-synchronized business visibility.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  connectivity_plus: ^6.1.0
  dio: ^5.7.0
  drift: ^2.22.0
  firebase_core: ^3.8.0
  firebase_crashlytics: ^4.1.0
  firebase_messaging: ^15.1.0
  fl_chart: ^0.69.0
  flutter_riverpod: ^2.6.0
  flutter_secure_storage: ^9.2.0
  freezed_annotation: ^2.4.4
  go_router: ^14.6.0
  json_annotation: ^4.9.0
  local_auth: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.13
  drift_dev: ^2.22.0
  freezed: ^2.5.7
  json_serializable: ^6.9.0
  very_good_analysis: ^6.0.0

flutter:
  uses-material-design: true
