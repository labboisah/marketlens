openapi: 3.1.0
info:
  title: MarketLens Platform API
  version: 1.0.0
  summary: Versioned Platform APIs for synchronization, device activation, authentication, and monitoring.
  description: >
    Foundation OpenAPI document for MarketLens Platform APIs. Endpoint schemas
    should be expanded as domain modules move from scaffold to implementation.
servers:
  - url: /api/v1
    description: Platform API v1
tags:
  - name: Authentication
  - name: Devices
  - name: Synchronization
  - name: Monitoring
paths:
  /auth/login:
    post:
      tags: [Authentication]
      summary: Authenticate a Platform or Monitoring user.
      operationId: authLogin
      responses:
        "200":
          description: Login accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "422":
          $ref: "#/components/responses/ValidationError"
  /auth/logout:
    post:
      tags: [Authentication]
      summary: Revoke the current API token.
      operationId: authLogout
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Logout accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
  /auth/user:
    get:
      tags: [Authentication]
      summary: Return the authenticated Platform user.
      operationId: authUser
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Authenticated user returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
  /device/activate:
    post:
      tags: [Devices]
      summary: Activate a Shop App device.
      operationId: deviceActivate
      responses:
        "200":
          description: Device activation accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "422":
          $ref: "#/components/responses/ValidationError"
  /device/versions:
    get:
      tags: [Devices]
      summary: List supported application versions.
      operationId: deviceVersions
      responses:
        "200":
          description: Application versions returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
  /sync/batches:
    post:
      tags: [Synchronization]
      summary: Upload a Shop App synchronization batch.
      operationId: syncBatchStore
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/DeviceUuid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncEnvelope"
      responses:
        "200":
          description: Batch processed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncResponse"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/AuthorizationDenied"
        "422":
          $ref: "#/components/responses/ValidationError"
  /sync/batches/{batch}:
    get:
      tags: [Synchronization]
      summary: Retrieve sync batch status.
      operationId: syncBatchShow
      security:
        - bearerAuth: []
      parameters:
        - name: batch
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Batch status returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "404":
          $ref: "#/components/responses/NotFound"
  /monitoring/dashboard:
    get:
      tags: [Monitoring]
      summary: Return owner dashboard summary data.
      operationId: monitoringDashboard
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - name: filter[branch_uuid]
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Dashboard summary returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
  /monitoring/branches:
    get:
      tags: [Monitoring]
      summary: List branches visible to the authenticated monitoring user.
      operationId: monitoringBranches
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Branches returned.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      meta:
                        $ref: "#/components/schemas/CursorPaginationMeta"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: token
  parameters:
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: false
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        maxLength: 200
    DeviceUuid:
      name: X-MarketLens-Device-UUID
      in: header
      required: true
      schema:
        type: string
        format: uuid
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
  responses:
    ValidationError:
      description: Validation failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    AuthenticationRequired:
      description: Authentication required.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    AuthorizationDenied:
      description: Authorization denied.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    SuccessResponse:
      type: object
      required: [success, message, data, meta]
      properties:
        success:
          type: boolean
          const: true
        message:
          type: string
          example: Operation completed
        data:
          type: object
          additionalProperties: true
        meta:
          type: object
          additionalProperties: true
    ErrorResponse:
      type: object
      required: [success, message, code, errors, trace_id]
      properties:
        success:
          type: boolean
          const: false
        message:
          type: string
          example: Validation failed
        code:
          type: string
          example: VALIDATION_ERROR
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        trace_id:
          type: string
          format: uuid
    CursorPaginationMeta:
      type: object
      required: [pagination]
      properties:
        pagination:
          type: object
          required: [limit, next_cursor, previous_cursor, has_more]
          properties:
            limit:
              type: integer
            next_cursor:
              type:
                - string
                - "null"
            previous_cursor:
              type:
                - string
                - "null"
            has_more:
              type: boolean
    SyncEnvelope:
      type: object
      required: [protocol_version, batch_uuid, business_uuid, branch_uuid, device_uuid, created_at, records]
      properties:
        protocol_version:
          type: string
          const: "1.0"
        batch_uuid:
          type: string
          format: uuid
        business_uuid:
          type: string
          format: uuid
        branch_uuid:
          type: string
          format: uuid
        device_uuid:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        records:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/SyncRecord"
    SyncRecord:
      type: object
      required: [entity, record_uuid, operation, version, idempotency_key, occurred_at, payload]
      properties:
        entity:
          type: string
        record_uuid:
          type: string
          format: uuid
        operation:
          type: string
          enum: [create, update, void, return, summary_update]
        version:
          type: integer
          minimum: 1
        idempotency_key:
          type: string
        occurred_at:
          type: string
          format: date-time
        payload:
          type: object
          additionalProperties: true
    SyncResponse:
      type: object
      required: [batch_uuid, status, accepted, rejected, conflicts, server_time]
      properties:
        batch_uuid:
          type: string
          format: uuid
        status:
          type: string
          enum: [accepted, partial, rejected, conflict]
        accepted:
          type: array
          items:
            type: object
            additionalProperties: true
        rejected:
          type: array
          items:
            type: object
            additionalProperties: true
        conflicts:
          type: array
          items:
            type: object
            additionalProperties: true
        server_time:
          type: string
          format: date-time
