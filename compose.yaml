services:
  postgres:
    image: postgres:16
    container_name: marketlens-platform-postgres
    environment:
      POSTGRES_DB: marketlens_platform
      POSTGRES_USER: marketlens
      POSTGRES_PASSWORD: marketlens
    ports:
      - "5432:5432"
    volumes:
      - platform-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketlens -d marketlens_platform"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: marketlens-platform-redis
    ports:
      - "6379:6379"
    volumes:
      - platform-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: marketlens-platform-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  platform-postgres-data:
  platform-redis-data:
